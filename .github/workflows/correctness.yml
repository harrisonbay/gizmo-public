name: Correctness scaffold

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  audit:
    name: Python audit validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry, fixtures, and regressions
        run: |
          python -m unittest discover -s validation/tests -v
          python -m unittest discover -s validation/regressions -v

  rust:
    name: Rust formatting and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: rust
        run: test -f rust/Cargo.toml && echo "present=true" >> "$GITHUB_OUTPUT" || true
      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust.outputs.present == 'true'
        with:
          components: clippy, rustfmt
      - name: Check formatting
        if: steps.rust.outputs.present == 'true'
        working-directory: rust
        run: cargo fmt --all --check
      - name: Check all targets
        if: steps.rust.outputs.present == 'true'
        working-directory: rust
        run: cargo check --all-targets
      - name: Run tests
        if: steps.rust.outputs.present == 'true'
        working-directory: rust
        run: cargo test
      - name: Run pinned sound-wave initialization oracle
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_soundwave_init.sh
      - name: Run pinned shock-tube evolution oracles
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_shocktube.sh
      - name: Run pinned interacting-blast evolution oracle
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_interactblast.sh
      - name: Run pinned dusty-wave gas-grain evolution oracle
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_dustywave.sh
      - name: Run pinned dusty-box analytic evolution oracle
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_dustybox.sh
      - name: Run pinned Brio-Wu two-dimensional initialization oracle
        if: steps.rust.outputs.present == 'true'
        run: validation/oracles/run_rust_briowu_init.sh
      - name: Deny Clippy warnings
        if: steps.rust.outputs.present == 'true'
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  gresho:
    name: Full Rust Gresho trajectory
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install trajectory-analysis dependencies
        run: python -m pip install h5py==3.15.1 numpy==2.4.0
      - name: Run analytic and corrected-C trajectory gates
        env:
          GIZMO_ACTIVE_TARGET_THREADS: "4"
        run: validation/oracles/run_rust_gresho.sh
