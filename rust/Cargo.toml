[workspace]
resolver = "2"
members = [
    "crates/gizmo-audit",
    "crates/gizmo-cli",
    "crates/gizmo-config",
    "crates/gizmo-core",
]

[workspace.package]
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

